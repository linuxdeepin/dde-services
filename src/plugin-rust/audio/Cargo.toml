[package]
name = "plugin-rust-audio"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "plugin_rust_audio"
crate-type = ["cdylib", "rlib"]

[dependencies]
zbus = "5.19.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libpulse-binding = "2.30.1"
crossbeam-channel = "0.5"
log = "0.4"
parking_lot = "0.12"
